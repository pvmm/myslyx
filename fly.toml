# Myslyx on fly.io (shared deployment).
#
#   fly launch        # first time: reuses this file, creates the app
#   fly deploy        # ship it
#   fly open          # open /editor in a browser
#
# Notes:
# - MYSLYX_LOCAL=0 forces "remote/shared" mode (see myslyx/local.py), so
#   local-only plugins and the machine-LSP bridge stay off, exactly like on
#   the Hugging Face Space. The in-browser LSP (weblsp) keeps working.
# - The app reads $PORT itself (app.py); fly sets PORT automatically, and
#   8080 is the fallback both here and in [http_service].
# - min_machines_running = 0 stops the machine when idle (cold start on
#   next visit). Set it to 1 if you want it always warm.

app = 'myslyx'

[build]

[env]
  MYSLYX_LOCAL = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
