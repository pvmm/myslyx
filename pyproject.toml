[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myslyx"
description = "A retro-styled, in-browser code editor built with NiceGUI and CodeMirror."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro \"pvm\" Medeiros" }]
keywords = ["nicegui", "codemirror", "editor", "browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Editors",
]
dependencies = [
    "nicegui>=3.16.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "playwright>=1.49.0",
]

[project.scripts]
myslyx = "myslyx.app:run"

[tool.setuptools]
packages = ["myslyx", "myslyx.pages"]
include-package-data = true

[tool.setuptools.package-data]
myslyx = ["STARTUP.txt"]

[tool.setuptools.dynamic]
version = { attr = "myslyx.__version__" }